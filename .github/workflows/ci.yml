# 牧云 MoonShepherd CI：push 自动测试、构建双镜像推 GHCR（docs/03 §6.2 分发通道）
# 镜像地址：ghcr.io/<owner>/moonshepherd（面板）与 ghcr.io/<owner>/herd（Agent）
# push main → latest + sha 标签；push v* tag → 语义化版本标签
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 先产出 web/dist 再跑 Go 检查：web/embed.go 的 go:embed all:dist
      # 要求编译期该目录存在（与 Makefile、Dockerfile.panel 的顺序一致）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端构建（vue-tsc 类型检查 + vite）
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Go 静态检查与测试
        run: |
          go vet ./...
          go test ./...

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: moonshepherd
            dockerfile: packaging/Dockerfile.panel
          - name: herd
            dockerfile: packaging/Dockerfile.agent
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # 二进制版本与镜像 tag 解耦:metadata-action 的 outputs.version 会被
      # 高优先级的 raw latest 标签污染成 "latest",导致面板与 Agent 二进制
      # 自报版本恒为 latest、新旧无法区分(升级判定是字符串相等比较,恒等
      # 即永远"已是最新")。此处显式计算:tag 事件 → v0.1.0;branch push → main-<sha7>
      - name: 计算二进制版本
        id: binver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像标签（小写镜像名 + 语义化标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # sha 标签前缀:push 分支用 <branch>-;push tag 事件无 branch,{{branch}} 渲染为空
          # 会生成非法标签 "image:-94e8f0d"(v0.1.0 曾因此失败),tag 事件改用 v 前缀
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=v-,enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.binver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
