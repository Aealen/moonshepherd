# 牧云 MoonShepherd CI：push 自动测试、构建面板镜像推 GHCR（docs/03 §6.2 分发通道）
# 镜像地址：ghcr.io/<owner>/moonshepherd（面板）；Agent 为裸二进制分发，不出镜像
# push main → latest + sha 标签；push v* tag → 语义化版本标签
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 先产出 web/dist 再跑 Go 检查：web/embed.go 的 go:embed all:dist
      # 要求编译期该目录存在（与 Makefile、Dockerfile.panel 的顺序一致）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 前端构建（vue-tsc 类型检查 + vite）
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Go 静态检查与测试
        run: |
          go vet ./...
          go test ./...

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: moonshepherd
            dockerfile: packaging/Dockerfile.panel
    steps:
      - uses: actions/checkout@v4

      # 双平台构建免 QEMU:Dockerfile 构建阶段固定 $BUILDPLATFORM + Go 交叉编译,
      # runner 层零 RUN 指令,无需模拟执行目标平台指令(此前 arm64 全程模拟,单次 30+ 分钟)
      - uses: docker/setup-buildx-action@v3

      # 二进制版本与镜像 tag 解耦:metadata-action 的 outputs.version 会被
      # 高优先级的 raw latest 标签污染成 "latest",导致面板与 Agent 二进制
      # 自报版本恒为 latest、新旧无法区分(升级判定是字符串相等比较,恒等
      # 即永远"已是最新")。此处显式计算:tag 事件 → v0.1.0;branch push → main-<sha7>
      - name: 计算二进制版本
        id: binver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像标签（小写镜像名 + 语义化标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          # sha 标签前缀:push 分支用 <branch>-;push tag 事件无 branch,{{branch}} 渲染为空
          # 会生成非法标签 "image:-94e8f0d"(v0.1.0 曾因此失败),tag 事件改用 v 前缀
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=v-,enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.binver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 打 tag 出二进制 Release:面板(linux amd64/arm64,含 systemd unit)与
  # Agent(amd64/arm64/armv7)产物挂 GitHub Release。仓库私有阶段仅协作者
  # 可下载,转 public 开源后历史产物自动公开(docs/01 §4.2 分发通道②)。
  release:
    name: 打包发布（二进制 → Release）
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # make cross 依赖 frontend 目标(node 构建产出 web/dist,go:embed 源);
      # 版本号经 git describe 自动取 tag 名(LDFLAGS 注入 version 包)
      - name: 交叉编译全平台产物
        run: make cross

      - name: 打包面板与 Agent
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            pkg=moonshepherd-panel-linux-$arch
            mkdir -p "$pkg/distro-bin"
            cp dist/moon-linux-$arch "$pkg/moon"
            cp packaging/moonshepherd.service "$pkg/moonshepherd.service"
            # distro-bin:agent.update 与 install.sh 的分发源(docs/08 目录规范),随包附带免二次构建
            cp dist/herd-linux-amd64 dist/herd-linux-arm64 dist/herd-linux-armv7 "$pkg/distro-bin/"
            tar -czf "release/$pkg.tar.gz" -C "$pkg" .
          done
          for arch in amd64 arm64 armv7; do
            pkg=herd-agent-linux-$arch
            mkdir -p "$pkg"
            cp dist/herd-linux-$arch "$pkg/herd"
            tar -czf "release/$pkg.tar.gz" -C "$pkg" .
          done
          cd release && sha256sum *.tar.gz > checksums.txt

      # 私有仓库对第三方 action 解析受限(softprops/action-ghrelease 报
      # repository not found),改用 runner 预装的 gh CLI;tag 已有 Release 时走 upload 覆盖
      - name: 上传 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" release/*.tar.gz release/checksums.txt --clobber \
            || gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/checksums.txt --title "$GITHUB_REF_NAME" --notes "二进制产物(校验和见 checksums.txt)"
